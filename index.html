<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #131729;
      --text: #f0f4ff;
      --muted: #8b9dc3;
      --border: rgba(139, 157, 195, 0.15);
      --accent: #5b8def;
      --online: #00ff88;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    header {
      position: relative; z-index: 10;
      display: flex; align-items: center; padding: 0 24px;
      height: 52px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 14, 26, 0.9);
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
    }

    .brand-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: 6px;
      vertical-align: middle;
      margin-bottom: 2px;
      animation: blink 1.8s ease-in-out infinite;
    }

    .page {
      position: relative; z-index: 1;
      height: calc(100vh - 52px);
      display: flex;
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      gap: 16px;
    }

    .launch-btn {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 32px;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--accent);
      border: none; border-radius: 8px;
      cursor: pointer;
      width: 200px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Nova<span class="brand-dot"></span></div>
  </header>

  <div class="page">
    <button class="launch-btn" onclick="openNova()">Nova (My Site)</button>
    <button class="launch-btn" onclick="openGnMath()">Gn-Math</button>
  </div>

<script>
// Nova button
function openNova() {
  var win = window.open();
  if (!win) {
    alert('Pop-up blocked — please allow pop ups and come back');
    return;
  }

  var iframe = win.document.createElement('iframe');
  iframe.style.width = "100%";
  iframe.style.height = "100%";
  iframe.style.border = "none";
  iframe.src = "https://jeremyryanknight2012.github.io/Unblocked-Hub/nova.html";

  win.document.body.style.margin = "0";
  win.document.body.appendChild(iframe);
}

// Gn-Math button
function openGNMATH() {
  var win = window.open();
  if (!win) {
    alert('Pop-up blocked — please allow pop ups and come back');
    return;
  }

  var iframe = win.document.createElement('iframe');
  iframe.style.width = "100%";
  iframe.style.height = "100%";
  iframe.style.border = "none";
  iframe.src = "https://jeremyryanknight2012.github.io/gn-m41h/";

  win.document.body.style.margin = "0";
  win.document.body.appendChild(iframe);
}

</script>

</body>
</html>
