<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #131729;
      --text: #f0f4ff;
      --muted: #8b9dc3;
      --border: rgba(139, 157, 195, 0.15);
      --accent: #5b8def;
      --online: #00ff88;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .bg-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden; z-index: 0; pointer-events: none;
    }
    .gradient-wave {
      position: absolute; width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(91, 141, 239, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(147, 51, 234, 0.08) 0%, transparent 50%);
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(60px);
      opacity: 0.18; pointer-events: none; animation: floatOrb 30s ease-in-out infinite;
    }
    .orb-1 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(91, 141, 239, 0.5), transparent 70%);
      top: 5%; left: 5%; animation-duration: 35s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.4), transparent 70%);
      bottom: 5%; right: 5%; animation-duration: 40s; animation-delay: -15s;
    }
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(80px, -80px); }
    }
    .grid-overlay {
      position: absolute; width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(91, 141, 239, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91, 141, 239, 0.04) 1px, transparent 1px);
      background-size: 80px 80px; opacity: 0.4;
    }
    .scanline {
      position: absolute; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(91, 141, 239, 0.3) 50%, transparent 100%);
      animation: scanlineMove 8s linear infinite;
    }
    @keyframes scanlineMove { 0% { top: -2px; } 100% { top: 100%; } }
    .energy-ring {
      position: absolute; top: 50%; left: 50%;
      border: 1px solid rgba(91, 141, 239, 0.15);
      border-radius: 50%;
      animation: energyExpand 10s ease-out infinite;
    }
    .energy-ring:nth-child(2) { animation-delay: 5s; }
    @keyframes energyExpand {
      0%   { width: 80px;  height: 80px;  opacity: 0.6; transform: translate(-50%, -50%); }
      100% { width: 900px; height: 900px; opacity: 0;   transform: translate(-50%, -50%); }
    }
    .particles { position: absolute; width: 100%; height: 100%; }
    .particle {
      position: absolute; width: 2px; height: 2px;
      border-radius: 50%;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0%   { transform: translateY(100vh); opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.8; }
      100% { transform: translateY(-100vh) translateX(var(--drift, 0px)); opacity: 0; }
    }

    header {
      position: relative; z-index: 10;
      display: flex; align-items: center; padding: 0 24px;
      height: 52px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 14, 26, 0.9);
    }
    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
    }
    .brand-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: 6px;
      vertical-align: middle;
      margin-bottom: 2px;
      animation: blink 1.8s ease-in-out infinite;
    }

    .page {
      position: relative; z-index: 1;
      height: calc(100vh - 52px);
      display: flex;
      align-items: center; justify-content: center;
    }

    .launch-btn {
      position: relative;
      display: inline-flex; align-items: center; gap: 12px;
      padding: 14px 32px;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--accent);
      border: none; border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Nova<span class="brand-dot"></span></div>
  </header>

  <div class="page">
    <button class="launch-btn" onclick="openNova()">Nova</button>
  </div>

<script>
// UPDATED FUNCTION (about:blank iframe version)
function openNova() {
  var win = window.open();
  if (!win) {
    alert('Pop-up blocked — please allow pop ups and come back');
    return;
  }

  var iframe = win.document.createElement('iframe');
  iframe.style.width = "100%";
  iframe.style.height = "100%";
  iframe.style.border = "none";
  iframe.src = "https://jeremyryanknight2012.github.io/Unblocked-Hub/nova.html";

  win.document.body.style.margin = "0";
  win.document.body.appendChild(iframe);
}
</script>

</body>
</html>
