<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --bg-gradient: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 100%);
      --panel: #131729;
      --panel2: #0f1424;
      --text: #f0f4ff;
      --muted: #8b9dc3;
      --border: rgba(139, 157, 195, 0.15);
      --hover: rgba(91, 141, 239, 0.1);
      --active: rgba(91, 141, 239, 0.2);
      --accent: #5b8def;
      --accent-glow: rgba(91, 141, 239, 0.4);
      --online: #00ff88;
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    /* ── BACKGROUND ── */
    .bg-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden; z-index: 0; pointer-events: none;
    }
    .gradient-wave {
      position: absolute; width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(91, 141, 239, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(147, 51, 234, 0.08) 0%, transparent 50%);
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(60px);
      opacity: 0.18; pointer-events: none; animation: floatOrb 30s ease-in-out infinite;
    }
    .orb-1 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(91, 141, 239, 0.5), transparent 70%);
      top: 5%; left: 5%; animation-duration: 35s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.4), transparent 70%);
      bottom: 5%; right: 5%; animation-duration: 40s; animation-delay: -15s;
    }
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(80px, -80px); }
    }
    .grid-overlay {
      position: absolute; width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(91, 141, 239, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91, 141, 239, 0.04) 1px, transparent 1px);
      background-size: 80px 80px; opacity: 0.4;
    }
    .scanline {
      position: absolute; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(91, 141, 239, 0.3) 50%, transparent 100%);
      animation: scanlineMove 8s linear infinite;
    }
    @keyframes scanlineMove { 0% { top: -2px; } 100% { top: 100%; } }
    .energy-ring {
      position: absolute; top: 50%; left: 50%;
      border: 1px solid rgba(91, 141, 239, 0.15);
      border-radius: 50%;
      animation: energyExpand 10s ease-out infinite;
    }
    .energy-ring:nth-child(2) { animation-delay: 5s; }
    @keyframes energyExpand {
      0%   { width: 80px;  height: 80px;  opacity: 0.6; transform: translate(-50%, -50%); }
      100% { width: 900px; height: 900px; opacity: 0;   transform: translate(-50%, -50%); }
    }
    .particles { position: absolute; width: 100%; height: 100%; }
    .particle {
      position: absolute; width: 2px; height: 2px;
      background: rgba(91, 141, 239, 0.5); border-radius: 50%;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0%   { transform: translateY(100vh); opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.8; }
      100% { transform: translateY(-100vh) translateX(var(--drift, 0px)); opacity: 0; }
    }

    /* ── HEADER ── */
    header {
      position: relative; z-index: 10;
      display: flex; align-items: center; padding: 0 20px;
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: rgba(19, 23, 41, 0.95);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }
    .brand {
      font-weight: 800; font-size: 22px; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #5b8def 0%, #00ff88 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-info { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .info-item {
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 4px 10px;
      background: rgba(91, 141, 239, 0.08);
      border: 1px solid var(--border); border-radius: 8px; min-width: 90px;
    }
    .info-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 1px; }
    .info-value { font-size: 13px; font-weight: 700; color: var(--text); }
    #current-time { font-family: 'Courier New', monospace; letter-spacing: 0.05em; }

    /* ── MAIN CONTENT ── */
    .page {
      position: relative; z-index: 1;
      height: calc(100vh - 56px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 32px;
    }

    /* ── CARD ── */
    .card {
      background: rgba(19, 23, 41, 0.85);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 52px 64px;
      box-shadow: var(--card-shadow), 0 0 80px rgba(91, 141, 239, 0.08);
      text-align: center;
      max-width: 480px;
      width: 90%;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    .card-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, rgba(91,141,239,0.2) 0%, rgba(0,255,136,0.1) 100%);
      border: 1px solid rgba(91,141,239,0.3);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      box-shadow: 0 4px 24px rgba(91,141,239,0.2);
    }

    .card h1 {
      font-size: 32px; font-weight: 800; letter-spacing: -1px;
      background: linear-gradient(135deg, #f0f4ff 0%, #5b8def 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      line-height: 1.1;
    }
    .card p {
      color: var(--muted); font-size: 14px; line-height: 1.6; font-weight: 500;
    }

    /* ── NOVA BUTTON ── */
    .nova-btn {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 10px;
      padding: 16px 48px;
      font-family: 'Inter', sans-serif;
      font-size: 16px; font-weight: 800; letter-spacing: 0.5px;
      color: #fff;
      background: linear-gradient(135deg, #3a6fd8 0%, #5b8def 60%, #4ade80 100%);
      border: none; border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(91,141,239,0.45), 0 0 0 0 rgba(91,141,239,0.4);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      overflow: hidden;
      outline: none;
      width: 100%;
    }
    .nova-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
      border-radius: inherit;
      pointer-events: none;
    }
    .nova-btn::after {
      content: '';
      position: absolute; top: -50%; left: -60%;
      width: 50%; height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: skewX(-20deg);
      animation: shimmer 3s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { left: -60%; }
      100% { left: 130%; }
    }
    .nova-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 40px rgba(91,141,239,0.6), 0 0 0 4px rgba(91,141,239,0.15);
      filter: brightness(1.08);
    }
    .nova-btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 2px 12px rgba(91,141,239,0.35);
    }
    .nova-btn-icon {
      font-size: 18px; line-height: 1;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.15); }
    }

    /* ── STATUS BADGE ── */
    .status-badge {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 14px;
      background: rgba(0, 255, 136, 0.07);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 20px;
      font-size: 12px; font-weight: 700; color: var(--online);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 6px var(--online);
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── FOOTER HINT ── */
    .hint {
      font-size: 11px; color: rgba(139,157,195,0.5);
      font-weight: 500; letter-spacing: 0.05em;
    }

    /* ── NOTIFICATION ── */
    .notification {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(19, 23, 41, 0.98);
      border: 2px solid var(--accent);
      border-radius: 14px; padding: 12px 20px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 6px 24px rgba(91, 141, 239, 0.25);
      transform: translateX(150%);
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 10000; max-width: 320px;
    }
    .notification.show { transform: translateX(0); }
    .notification-text { font-weight: 700; font-size: 13px; }

    @media (max-width: 480px) {
      .card { padding: 36px 28px; }
      .header-info { display: none; }
    }
  </style>
</head>

  <div class="bg-container">

    <div class="orb orb-2"></div>
    <div class="grid-overlay"></div>

    <div class="energy-ring"></div>
    <div class="energy-ring"></div>
    <div class="particles" id="particles"></div>
  </div>

  <header>
    <div class="brand">Nova</div>
    <div class="header-info">

        <span class="info-label">Time</span>

      </div>
      <div class="info-item">

        <span class="info-value" style="color: var(--online);">Online</span>
      </div>

<script>
'use strict';

// ── CLOCK ──
let _lastSec = -1;
function clockTick() {
  const now = new Date(), sec = now.getSeconds();
  if (sec !== _lastSec) {
    _lastSec = sec;
    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2,'0'),
          s = String(sec).padStart(2,'0'),
          ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    document.getElementById('current-time').textContent =
      `${String(h).padStart(2,'0')}:${m}:${s} ${ampm}`;
  }
  requestAnimationFrame(clockTick);
}
requestAnimationFrame(clockTick);

// ── PARTICLES ──
(function createParticles() {
  const container = document.getElementById('particles'),
        frag = document.createDocumentFragment();
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = (Math.random() * 100) + '%';
    p.style.setProperty('--drift', ((Math.random() - 0.5) * 150) + 'px');
    p.style.animationDuration = (20 + Math.random() * 20) + 's';
    p.style.animationDelay = (Math.random() * 15) + 's';
    p.style.background = ['rgba(91,141,239,0.5)', 'rgba(0,255,136,0.4)', 'rgba(147,51,234,0.4)'][i % 3];
    frag.appendChild(p);
  }
  container.appendChild(frag);
})();

// ── NOTIFICATION ──
let _notifT = null;
function showNotif(text) {
  const el = document.getElementById('notification'),
        tx = document.getElementById('notif-text');
  tx.textContent = text;
  el.classList.add('show');
  if (_notifT) clearTimeout(_notifT);
  _notifT = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── OPEN NOVA ──
function openNova() {
  showNotif('🚀 Launching Nova...');
  var win = window.open('about:blank', '_blank');
  if (!win) { showNotif('⚠️ Pop-up blocked! Please allow pop-ups.'); return; }

  // The full Nova site HTML to inject
